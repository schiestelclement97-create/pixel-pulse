<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A2A4A">
  <title>TV Empire Tycoon</title>

  <!-- Police unique : Montserrat (Google Fonts). Hors ligne, le navigateur utilise la police système de secours. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
/* ==========================================================================
   TV EMPIRE TYCOON v2 - style.css
   Règles : 1 police (Montserrat) · 3 couleurs (bleu nuit, jaune, blanc/gris)
            · padding minimum 16px · icônes ligne 2px · aucune ombre dure
   ========================================================================== */

:root {
  --navy:   #1A2A4A;   /* primaire */
  --yellow: #FFC700;   /* accent : argent, actions principales */
  --white:  #FFFFFF;
  --grey:   #F0F2F5;   /* fond des zones */
  --muted:  #6B7488;   /* texte secondaire (bleu nuit désaturé) */
  --line:   rgba(26, 42, 74, .12);
  --radius: 12px;
  --shadow: 0 4px 14px rgba(26, 42, 74, .10);   /* ombre portée douce */
  --gap:    16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: "Montserrat", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color: var(--navy);
  background: var(--grey);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

/* --------------------------------------------------------------------------
   GRILLE PRINCIPALE : 3 zones qui ne bougent jamais
   -------------------------------------------------------------------------- */
#app {
  height: 100vh; height: 100dvh;
  display: grid;
  grid-template-columns: 20% 1fr;
  grid-template-rows: minmax(56px, 10%) 1fr;
  grid-template-areas:
    "top  top"
    "side stage";
}

/* ---------- TOP BAR ---------- */
#topbar {
  grid-area: top;
  display: flex; align-items: center;
  gap: 40px;                       /* 40px entre chaque élément */
  padding: 0 24px;
  background: var(--navy);
  color: var(--white);
  font-weight: 700; font-size: 24px;
  white-space: nowrap;
}
.stat { display: flex; align-items: center; gap: 12px; }
#btn-settings { margin-left: auto; }

/* ---------- ICÔNES (style ligne, trait 2px constant, 24px) ---------- */
.ico { display: inline-flex; width: 24px; height: 24px; flex: none; }
.ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2;
           stroke-linecap: round; stroke-linejoin: round; }
.ico svg * { vector-effect: non-scaling-stroke; }   /* le trait reste à 2px même agrandi */
.ico-accent { color: var(--yellow); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; border-radius: var(--radius);
  border: 2px solid rgba(255, 255, 255, .22); color: var(--white);
}
.icon-btn:hover { border-color: var(--yellow); color: var(--yellow); }

/* ---------- SIDEBAR ---------- */
#sidebar {
  grid-area: side;
  display: flex; flex-direction: column; gap: var(--gap);
  padding: var(--gap);
  background: var(--grey);
  border-right: 1px solid var(--line);
  min-height: 0; overflow-y: auto;
}
.side-title { font-size: 14px; font-weight: 800; letter-spacing: .14em; }

/* 5 cartes visibles maximum, ensuite on scrolle */
#cards {
  display: flex; flex-direction: column; gap: var(--gap);
  max-height: calc(5 * 104px + 4 * var(--gap));
  overflow-y: auto; padding: 4px;               /* 4px : laisse respirer l'ombre et la bordure */
  margin: -4px;
}
.card {
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px;
  align-items: center;
  padding: 14px;
  background: var(--white);
  border: 3px solid transparent;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  text-align: left; width: 100%;
  transition: transform .08s ease, border-color .12s ease, opacity .12s ease;
}
.card.selected { border-color: var(--navy); }   /* sélection : bordure bleue 3px */
.card.poor { opacity: .62; }
.card.can { border-color: var(--yellow); }                 /* achetable : liseré jaune */
.card.can .price { color: var(--navy); font-weight: 800; }
.card .own { color: var(--muted); font-weight: 700; font-size: 13px; }
.card.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }
.rate { font-size: 14px; font-weight: 700; color: var(--yellow); margin-left: -4px; white-space: nowrap; }
.card-icon {
  width: 64px; height: 64px; border-radius: var(--radius);
  background: var(--navy); color: var(--white);
  display: flex; align-items: center; justify-content: center;
}
.card-icon .ico { width: 64px; height: 64px; padding: 14px; }
.card-name { display: block; font-size: 16px; font-weight: 800; line-height: 1.2; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-body { display: block; min-width: 0; }
.card-line { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.card-line + .card-line { margin-top: 4px; }
.card-line .lbl { color: var(--muted); font-weight: 500; }
.card.poor .price { color: var(--muted); }
.card-line .val { font-variant-numeric: tabular-nums; }

#actions { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
#goal { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
.goal-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
.goal-k { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.goal-k .ico { width: 16px; height: 16px; }
.goal-r { color: var(--navy); background: var(--yellow); border-radius: 8px; padding: 2px 8px; letter-spacing: 0; }
.goal-r:empty { display: none; }
.goal-t { font-size: 14px; font-weight: 700; margin: 8px 0 10px; line-height: 1.3; }
.bar { height: 8px; border-radius: 4px; background: var(--grey); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--yellow); border-radius: 4px; transition: width .25s; }
#tap { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px; border-radius: var(--radius);
  background: var(--yellow); color: var(--navy); font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #C99A00; }
#tap:active { transform: translateY(3px) scale(.95); box-shadow: 0 1px 0 #C99A00; }
#tap .ico { width: 28px; height: 28px; }
.tap-t { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
.tap-t small { font-size: 12px; font-weight: 700; opacity: .75; }
#tap.hint { animation: pulse 1.1s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 4px 0 #C99A00, 0 0 0 0 rgba(255,199,0,.65); } 50% { box-shadow: 0 4px 0 #C99A00, 0 0 0 10px rgba(255,199,0,0); } }
#status { font-size: 12px; font-weight: 600; line-height: 1.5; color: var(--navy); min-height: 36px; }

/* ---------- CENTRE : plateau de jeu ---------- */
#stage { grid-area: stage; position: relative; overflow: hidden; background: #E4E8EF; touch-action: none; min-width: 0; min-height: 0; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#stage.placing { cursor: crosshair; }
#stage.hover   { cursor: pointer; }
#stage.drag    { cursor: grabbing; }

/* ---------- FEEDBACK : au clic, scale 0.95 ---------- */
.pressable { transition: transform .08s ease; }
.pressable:active, .card:active { transform: scale(.95); }

/* ---------- MODALE (600 x 400, centrée, fond noir 50%) ---------- */
#overlay {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .5);
  padding: var(--gap);
}
#overlay[hidden] { display: none; }
.modal {
  width: 600px; height: 400px; max-width: 100%; max-height: 100%;
  background: var(--white); border-radius: 16px;
  padding: 24px; display: flex; flex-direction: column; gap: var(--gap);
  overflow-y: auto; box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
  animation: pop-in .14s ease-out;
}
@keyframes pop-in { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.m-head { display: flex; align-items: center; gap: var(--gap); }
.m-head .card-icon { flex: none; }
.m-title { flex: 1; min-width: 0; }
.m-title h3 { font-size: 22px; font-weight: 800; line-height: 1.2; }
.m-title p  { font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 4px; }
.m-close { width: 48px; height: 48px; border-radius: var(--radius); border: 2px solid var(--line); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.m-close:hover { border-color: var(--navy); }

.m-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
.m-stat { background: var(--grey); border-radius: var(--radius); padding: 12px var(--gap); }
.m-stat .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.m-stat .val { font-size: 22px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }

.m-label { font-size: 12px; font-weight: 800; letter-spacing: .1em; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.seg button { padding: 10px 8px; border-radius: var(--radius); border: 2px solid var(--line); font-size: 13px; font-weight: 700; }
.seg button.on { background: var(--navy); border-color: var(--navy); color: var(--white); }
.m-hint { font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 8px; line-height: 1.4; }

.m-actions { display: flex; gap: var(--gap); margin-top: auto; }
.btn { flex: 1; padding: 14px 20px; border-radius: var(--radius); font-size: 14px; font-weight: 800; }
.btn-primary { background: var(--yellow); color: var(--navy); }
.btn-primary:disabled, .btn-primary.off { background: var(--grey); color: var(--muted); cursor: not-allowed; }
.btn-ghost { border: 2px solid var(--line); color: var(--navy); }
.btn-ghost:hover { border-color: var(--navy); }

/* Paramètres */
.m-row { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); padding: var(--gap); background: var(--grey); border-radius: var(--radius); font-weight: 700; font-size: 14px; }
.switch { width: 52px; height: 30px; border-radius: 15px; background: #C9CFDA; position: relative; flex: none; transition: background .12s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 4px rgba(0,0,0,.25); transition: transform .12s; }
.switch.on { background: var(--navy); }
.switch.on::after { transform: translateX(22px); }

/* --------------------------------------------------------------------------
   RESPONSIVE : écran étroit ou portrait -> la liste passe en bandeau horizontal sous le plateau
   (mêmes zones, même ordre logique, rien ne se chevauche)
   -------------------------------------------------------------------------- */
@media (max-width: 820px), (orientation: portrait) {
  #app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(56px, 10%) minmax(0, 1fr) auto;
    grid-template-areas: "top" "stage" "side";
  }
  #topbar { gap: 24px; padding: 0 var(--gap); font-size: 18px; }
  #topbar, #sidebar, #stage { min-width: 0; }
  #topbar { overflow: hidden; }
  #topbar .icon-btn { margin-left: auto; flex: none; }
  #sidebar { border-right: 0; border-top: 1px solid var(--line); padding: 12px var(--gap); gap: 8px; }
  #cards { flex-direction: row; max-height: none; overflow-x: auto; overflow-y: hidden; }
  .card { width: 250px; flex: none; padding: 12px; }
  #status { min-height: 0; font-size: 11px; }
  #actions { flex-direction: row; margin-top: 0; }
  #goal { flex: 1; min-width: 0; padding: 10px 12px; }
  .goal-t { margin: 4px 0 6px; font-size: 13px; }
  #tap { flex: none; width: 140px; padding: 10px; }
  .modal { width: min(600px, calc(100% - 32px)); height: auto; max-height: 100%; }
  .m-stats { gap: 8px; }
  .m-stat .val { font-size: 18px; }
}
@media (max-width: 560px) {
  #topbar { gap: 16px; font-size: 14px; padding: 0 12px; }
  .stat { gap: 8px; }
  #stat-time { display: flex; }
  #topbar { gap: 12px; }
  .icon-btn { width: 40px; height: 40px; }
}

/* ---------- v3 : cartes masquées tant que non atteignables, bouton d'agrandissement, sidebar compacte ---------- */
.card[hidden] { display: none; }
#expand , #dig { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius); background: var(--white);
  border: 3px solid transparent; box-shadow: var(--shadow); font-size: 13px; font-weight: 700; color: var(--navy); text-align: left; flex: none; }
#expand[hidden] , #dig[hidden] { display: none; }
#adboost { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius); background: var(--white); border: 3px solid var(--yellow); box-shadow: var(--shadow); font-size: 13px; font-weight: 700; color: var(--navy); text-align: left; flex: none; }
#adboost .ab-i { font-size: 18px; } #adboost .ex-t { flex: 1; } #adboost b { font-weight: 800; white-space: nowrap; }
#adboost.on { border-color: #2fbf71; } #adboost:disabled { opacity: .62; }
#expand .ico , #dig .ico { width: 20px; height: 20px; }
#expand .ex-t , #dig .ex-t { flex: 1; }
#expand b , #dig b { font-weight: 800; }
#expand.can , #dig.can { border-color: var(--yellow); }
#expand:not(.can) , #dig:not(.can) { opacity: .62; }
#expand.shake , #dig.shake { animation: shake .35s; }
#status:empty { display: none; }
.m-row b { font-variant-numeric: tabular-nums; }
@media (min-width: 821px) and (orientation: landscape) {
  #cards { flex: 1 1 0; min-height: 96px; max-height: none; }
  .card { padding: 10px 12px; }
  #goal { padding: 12px 14px; }
}
@media (max-width: 820px), (orientation: portrait) {
  #expand:not(.can) { display: none; }
  #dig:not(.can) { opacity: .75; }
  #cards { flex: none; }
}

@media (max-width: 560px) {
  #topbar { gap: 10px; padding: 0 10px; }
  #topbar .stat { gap: 5px; }
  #topbar .stat .ico { width: 18px; height: 18px; }
  .rate { font-size: 11px; margin-left: -2px; }
  .icon-btn { width: 36px; height: 36px; }
  #btn-settings .ico { width: 20px; height: 20px; }
}

/* ---------- v3.1 : mobile = la scène d'abord (barre du bas compacte, messages en bulle) ---------- */
@media (max-width: 820px), (orientation: portrait) {
  #app { grid-template-rows: 56px minmax(0, 1fr) auto; }
  .side-title { display: none; }
  #sidebar { padding: 8px 10px; gap: 8px; }
  #cards { gap: 8px; padding: 3px; }
  .card { width: 196px; padding: 8px 10px; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; }
  .card-icon { width: 48px; height: 48px; }
  .card-icon .ico { width: 48px; height: 48px; padding: 10px; }
  .card-name { font-size: 14px; margin-bottom: 4px; }
  .card-line { font-size: 11px; }
  #expand , #dig { padding: 8px 12px; font-size: 12px; }
  #goal { padding: 8px 12px; }
  .goal-t { font-size: 12px; margin: 2px 0 6px; }
  #tap { width: 118px; padding: 8px; font-size: 14px; gap: 8px; }
  #tap .ico { width: 24px; height: 24px; }
  #status { position: fixed; top: 64px; line-height: 1.35; left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px); z-index: 20; pointer-events: none;
    background: var(--navy); color: #fff; padding: 6px 12px; border-radius: 12px; font-size: 12px; text-align: center; box-shadow: var(--shadow); }
}

/* ---------- v4 : sélecteur d'étages ---------- */
#floors { display: flex; gap: 8px; flex: none; overflow-x: auto; }
#floors[hidden] { display: none; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--white); color: var(--navy);
  font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: var(--shadow); border: 2px solid transparent; flex: none; }
.chip b { font-weight: 800; color: var(--muted); }
.chip.on { background: var(--navy); color: #fff; }
.chip.on b { color: var(--yellow); }

/* ---------- page Ville ---------- */
body.city #cards, body.city #expand, body.city #dig, body.city #floors { display: none !important; }
body.city .side-title { display: none; }
body.city #citypanel .side-title { display: block; }
#citypanel { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; flex: 1 1 auto; }
#citypanel[hidden] { display: none; }
.cp-back { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 2px solid var(--navy); border-radius: 10px; background: #fff; color: var(--navy); font: 800 13px Montserrat, system-ui, sans-serif; cursor: pointer; }
.cp-hint { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.cp-item { border: 3px solid var(--line, #d5dae4); border-radius: 12px; background: #fff; overflow: hidden; }
.cp-item.on { border-color: var(--yellow); }
.cp-head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 0; background: transparent; text-align: left; cursor: pointer; font-family: inherit; color: var(--navy); }
.cp-name { display: flex; flex-direction: column; font-weight: 800; font-size: 15px; }
.cp-name small { font-weight: 600; font-size: 12px; color: var(--muted); }
.cp-body { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.cp-body p { margin: 0; font-size: 13px; color: var(--navy); }
.cp-stats { display: flex; gap: 8px; }
.cp-stats div { flex: 1; background: var(--bg, #F0F2F7); border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; }
.cp-stats span { font-size: 11px; color: var(--muted); font-weight: 700; }
.cp-stats b { font-size: 15px; color: var(--navy); }
.cp-buy { padding: 11px; border: 2px solid var(--ink, #111); border-radius: 10px; background: var(--yellow); color: var(--navy); font: 800 14px Montserrat, system-ui, sans-serif; cursor: pointer; }
.cp-buy.off { opacity: .55; background: #E4E8EF; }
.cp-buy.shake { animation: shake .35s; }
.cp-all { padding: 7px; border: 0; background: transparent; color: var(--muted); font: 700 12px Montserrat, system-ui, sans-serif; cursor: pointer; text-decoration: underline; }

.cp-item, .cp-top, .cp-hint { flex: none; }
body.city #goal, body.city #status { display: none; }
@media (max-width: 820px), (orientation: portrait) {
  #citypanel { max-height: 36vh; flex: none; gap: 6px; }
  body.city #actions { display: none; }
  #citypanel .side-title, .cp-hint { display: none !important; }
  .cp-top { position: sticky; top: 0; z-index: 1; }
  .cp-back { padding: 6px 10px; font-size: 12px; }
  .cp-head { padding: 6px; } .cp-name { font-size: 14px; } .cp-name small { font-size: 11px; }
  .cp-head .card-icon { width: 36px; height: 36px; flex: none; }
  .cp-body { gap: 6px; padding: 0 8px 8px; } .cp-body p { font-size: 12px; }
}
.cp-top { background: #F0F2F7; padding-bottom: 4px; }

.cp-sum { display: flex; gap: 6px; flex: none; }
.cp-sum div { flex: 1; background: #fff; border: 2px solid var(--line, #d5dae4); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; }
.cp-sum b { font-size: 15px; color: var(--navy); } .cp-sum span { font-size: 10px; font-weight: 700; color: var(--muted); }
.cp-type { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 2px solid var(--line, #d5dae4); border-radius: 10px; background: #fff; text-align: left; cursor: pointer; font-family: inherit; color: var(--navy); }
.cp-type.can { border-color: var(--yellow); } .cp-type.off { opacity: .55; }
.cp-type .card-icon { width: 34px; height: 34px; flex: none; } .cp-tn { flex: 1; display: flex; flex-direction: column; font-weight: 800; font-size: 14px; } .cp-tn small { font-weight: 600; font-size: 11px; color: var(--muted); } .cp-type b { font-size: 13px; }
.cp-type.shake { animation: shake .35s; }
@media (max-width: 820px), (orientation: portrait) { .cp-sum { gap: 4px; } .cp-sum div { padding: 4px 6px; } .cp-sum b { font-size: 13px; } }

/* ---------- code couleur des bonus : jaune = revenus · bleu nuit = audience · contour = hors ligne ---------- */
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; line-height: 1.55; white-space: nowrap; vertical-align: middle; }
.pill-rev { background: var(--yellow); color: var(--navy); }
.pill-aud { background: var(--navy); color: #fff; }
.pill-off { background: #fff; color: var(--navy); border: 1.5px solid var(--navy); line-height: 1.3; }
.cp-sum .k-aud { background: var(--navy); border-color: var(--navy); } .cp-sum .k-aud b, .cp-sum .k-aud span { color: #fff; }
.cp-sum .k-rev { background: var(--yellow); border-color: var(--yellow); } .cp-sum .k-rev b, .cp-sum .k-rev span { color: var(--navy); }
.cp-legend { display: flex; gap: 6px; flex: none; flex-wrap: wrap; }
.cp-tn small, .cp-name small { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 2px; }

</style>

<body>

  <!-- ================= 3 ZONES FIXES : TOP BAR / SIDEBAR / CENTRE ================= -->
  <div id="app">

    <!-- [TOP BAR] Argent · Audience · Heure/Jour · Paramètres (rien d'autre) -->
    <header id="topbar">
      <div class="stat" id="stat-money" title="Argent">

function timeFactor(h) {
  for (let i = 1; i < TIME_CURVE.length; i++) {
    const [h1, v1] = TIME_CURVE[i];
    if (h <= h1) { const [h0, v0] = TIME_CURVE[i - 1]; return v0 + (v1 - v0) * (h - h0) / (h1 - h0); }
  }
  return TIME_CURVE[TIME_CURVE.length - 1][1];
}

const facRev = () => (1 + 0.10 * facLv('tech')) * (1 + 0.06 * facLv('cant')) * (1 + 0.10 * facLv('shop')) * (1 + 0.12 * facLv('stade')) * (1 + lotBonus().rev / 100);

function studioRevenue(s, h, aud) {
  const def = STUDIOS[s.type];
  const perViewer = def.rev / def.viewers;                                   // $ par spectateur et par seconde

/* ==========================================================================
   5. SON : un "pop" léger (aucun fichier audio)
   ========================================================================== */
let audioCtx = null;
function pop(freq = 520) {
  if (!state.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * 1.7, t + 0.07);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.14, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.12);
  } catch (e) { /* le son est un bonus : on ignore les erreurs */ }
}

/* ==========================================================================
   6. TEXTURES : parquet bois clair, généré par code (rien à télécharger)
      - lames posées en quinconce, 4 tons très proches, grain à peine visible
      - texture dessinée à plat puis plaquée sur le sol en perspective isométrique
   ========================================================================== */
let floorTex = null;
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const TEX_S = 64;   // pixels de texture par case
function makeFloorTexture() {
  const w = GRID.cols * TEX_S, h = GRID.rows * TEX_S, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d'), rand = rng(11), plankH = TEX_S / 2;
  const tones = ['#EBD3AC', '#E6CDA3', '#EDD6B1', '#E8D0A8'];
  g.fillStyle = tones[0]; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += plankH) {
    let x = -rand() * TEX_S * 2;
    while (x < w) {
      const len = TEX_S * (2 + rand() * 2.5);
      g.fillStyle = tones[Math.floor(rand() * tones.length)];
      g.fillRect(x, y, len, plankH);
      // grain : 3 fils très pâles, légèrement ondulés
      g.lineWidth = 1;
      for (let k = 0; k < 3; k++) {
        g.strokeStyle = 'rgba(150,108,60,0.05)';
        const yy = y + 5 + rand() * (plankH - 10);
        g.beginPath(); g.moveTo(x, yy);
        for (let xx = x; xx <= x + len; xx += 10) g.lineTo(xx, yy + Math.sin(xx * 0.06 + k * 2) * 1.3);
        g.stroke();
      }
      g.fillStyle = 'rgba(125,88,46,0.14)'; g.fillRect(x + len - 1, y, 1.5, plankH);   // joint de bout
      x += len;
    }
    g.fillStyle = 'rgba(125,88,46,0.12)'; g.fillRect(0, y + plankH - 1, w, 1.5);        // joint de long
  }
  floorTex = c;
}

'use strict';
/* ==========================================================================
   7. RENDU
   ========================================================================== */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const stageEl = document.getElementById('stage');
let W = 0, H = 0, DPR = 1;
const view = { x: 0, y: 0, s: 1 };
const VIEW_MIN = 0.2, VIEW_MAX = 2.6;
const pointer = { x: -1, y: -1, inside: false };
let hoverId = null, hoverFac = null;

/* grille -> écran. gx, gy = cases ; z = hauteur en pixels (à zoom 1) */
const P = (gx, gy, z = 0) => [view.x + (gx - gy) * 48 * view.s, view.y + (gx + gy) * 24 * view.s - z * view.s];
/* écran -> grille (au niveau du sol) */
function toGrid(sx, sy) {
  const u = (sx - view.x) / (48 * view.s), v = (sy - view.y) / (24 * view.s);
  return { gx: (u + v) / 2, gy: (v - u) / 2 };
}

/* Cadrage automatique : on zoome sur les studios (pas sur toute la salle vide), avec une marge.
   Plus on construit, plus la caméra recule en douceur. Le joueur garde la main (drag / zoom) ;
   un achat ou un double-tap dans le vide recadre. */
const viewT = { x: 0, y: 0, s: 1 };       // vue cible
function fitView(snap) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (gx, gy, z) => { const px = (gx - gy) * 48, py = (gx + gy) * 24 - z; x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py); };
  const here = state.studios.filter((s) => s.f === state.floor), zb = -(ISO.slab + state.floor * FLOOR_H);
  const cf = state.city && state.cityFocus && focusInfo(state.cityFocus);
  if (cf) {   // zoom sur le bâtiment / terrain choisi, avec ses voisins autour : la ville continue hors de l'écran
    const r = cf.r, zt = cf.top, M = cf.M || 5;
    add(r[0] - M, r[1] - M, zt); add(r[0] + r[2] + M, r[1] - M, zt); add(r[0] + r[2] + M, r[1] + r[3] + M, 0); add(r[0] - M, r[1] + r[3] + M, 0);
  } else if (state.city) {
    add(-18, -18, 140); add(41, -18, 140); add(41, 24, 0); add(-18, 24, 0);
  } else if (state.floor < 0) {
    add(0, 0, WALL_B + 6); add(GRID.cols, 0, WALL_B + 6); add(GRID.cols, GRID.rows, -132); add(0, GRID.rows, -132);
  } else if (here.length) {
    let ax = Infinity, bx = -Infinity;
    for (const s of here) {
      const o = STUDIOS[s.type]; ax = Math.min(ax, s.x); bx = Math.max(bx, s.x + o.w);
      for (const z of [0, o.h + 34]) { add(s.x - 0.4, s.y - 0.4, z); add(s.x + o.w + 0.4, s.y - 0.4, z); add(s.x + o.w + 0.4, s.y + o.d + 0.4, z); add(s.x - 0.4, s.y + o.d + 0.4, z); }
    }
    add(ax, ROW_B, 0); add(bx, ROW_B, 0); add(ax, 0, 160);                 // + un peu de mur (fenêtres, enseigne) au-dessus des studios                           // on garde le couloir dans le cadre
    add(ax, GRID.rows, zb - BASE_H * 0.6); add(bx, GRID.rows, zb - BASE_H * 0.6);   // on garde un bout de façade / hall dans le cadre
  } else {
    add(0, 0, ISO.wall); add(GRID.cols, 0, ISO.wall); add(GRID.cols, GRID.rows, zb - BASE_H); add(0, GRID.rows, zb - BASE_H);
  }
  const sc = Math.max(VIEW_MIN, Math.min(1.5, Math.min(W / (x1 - x0), H / (y1 - y0)) * 0.94));
  viewT.s = sc; viewT.x = W / 2 - (x0 + x1) / 2 * sc; viewT.y = H / 2 - (y0 + y1) / 2 * sc;
  if (snap) { view.s = viewT.s; view.x = viewT.x; view.y = viewT.y; }
}
function resize() {
  const r = stageEl.getBoundingClientRect();

  DPR = Math.min(window.devicePixelRatio || 1, 2);

function clampView() {          // garde toujours une partie du plateau à l'écran
  const margin = 80;

  view.y = Math.max(margin - (GRID.cols + GRID.rows) * 24 * view.s, Math.min(H - margin + ISO.wall * view.s, view.y));

/* ---------- petits outils de dessin ---------- */
function shade(hex, k) {   // k < 1 assombrit, k > 1 éclaircit vers le blanc
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;

function box(x, y, w, d, h, z0, color) {
  poly([P(x, y + d, z0), P(x + w, y + d, z0), P(x + w, y + d, z0 + h), P(x, y + d, z0 + h)], shade(color, 0.88), true);

/* texte posé sur une face verticale (plan y constant) */
function faceText(txt, x, y, z, size, color) {

function softShadow(x, y, w, d) {

    poly([P(x - m + 0.45, y - m + 0.12), P(x + w + m + 0.45, y - m + 0.12), P(x + w + m + 0.45, y + d + m + 0.12), P(x - m + 0.45, y + d + m + 0.12)], `rgba(26,42,74,${a})`, false);

}

}

  poly([P(x - 0.12, y - 0.08, z0 + 32), P(x + 0.04, y - 0.08, z0 + 32), P(x + 0.04, y + 0.02, z0 + 32), P(x - 0.12, y + 0.02, z0 + 32)], 'rgba(255,255,255,.32)', false);  // reflet
  box(x + 0.16, y - 0.06, 0.12, 0.12, 8, z0 + 21, '#9AA3B5');                          // objectif métal

/* ---------- les 3 studios (chacun a sa silhouette ; couleurs = bleu nuit, jaune, blanc + bois) ---------- */
function drawNews(s, t) {

  const zy = y + 0.22;
  poly([P(x + 0.25, zy, 19), P(x + 1.75, zy, 19), P(x + 1.75, zy, 67), P(x + 0.25, zy, 67)], shade(COLORS.screen, 0.9 + 0.25 * pulse), true);
  poly([P(x + 0.25, zy, 19), P(x + 1.75, zy, 19), P(x + 1.75, zy, 29), P(x + 0.25, zy, 29)], COLORS.yellow, true);   // bandeau défilant

/* ---------- décor de l'étage : plantes, banc, distributeur, personnel qui circule dans le couloir ---------- */
const SKIN = ['#F2D2B0', '#E0B48A', '#C68E63', '#8D5A3B', '#F6DCC4'], HAIR = ['#2A1E16', '#6B4423', '#C9A35A', '#1B1B1B', '#B5513A', '#9A9A9A'];
function person(x, y, col, t, seed) {
  if (seed === undefined) seed = (col.charCodeAt(1) || 0) + (col.charCodeAt(2) || 0) * 3;
  const sw = Math.sin(t * 8), bob = Math.abs(sw) * 1.4, skin = SKIN[seed % 5], hair = HAIR[(seed * 7) % 6], pants = seed % 2 ? '#2A2F3B' : '#46506B';
  poly([P(x - 0.2, y - 0.1), P(x + 0.2, y - 0.1), P(x + 0.2, y + 0.1), P(x - 0.2, y + 0.1)], 'rgba(26,42,74,0.16)', false);
  box(x - 0.1, y - 0.04 + sw * 0.05, 0.08, 0.08, 8, 0, pants); box(x + 0.02, y - 0.04 - sw * 0.05, 0.08, 0.08, 8, 0, pants);                 // jambes qui marchent
  box(x - 0.2, y - 0.03 - sw * 0.05, 0.07, 0.07, 9, 8 + bob, shade(col, 0.82)); box(x + 0.13, y - 0.03 + sw * 0.05, 0.07, 0.07, 9, 8 + bob, shade(col, 0.82));   // bras
  box(x - 0.12, y - 0.08, 0.24, 0.16, 11, 8 + bob, col);                                                                                     // torse
  const b = P(x + 0.03, y + 0.08, 15 + bob); ctx.fillStyle = COLORS.yellow; ctx.fillRect(b[0], b[1], 3 * view.s, 4 * view.s);               // badge
  const h = P(x, y, 25 + bob), r = 5.4 * view.s;
  dot(h[0], h[1], 5.4, skin);
  ctx.beginPath(); ctx.arc(h[0], h[1] - 0.6 * view.s, r + 0.4, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); ctx.fillStyle = seed % 5 === 1 ? COLORS.navy : hair; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = COLORS.ink; ctx.stroke();   // cheveux / casquette
  if (seed % 5 === 1) { ctx.fillStyle = COLORS.navy; ctx.fillRect(h[0] + r * 0.1, h[1] - 1.5 * view.s, r * 1.2, 2.2 * view.s); }
  if (seed % 3 === 0) { ctx.fillStyle = COLORS.ink; ctx.fillRect(h[0] - r * 0.5, h[1] + 0.2 * view.s, r * 1.2, 1.3 * view.s); }               // lunettes
}
function decorItems(t) {

    const a = P(x, y, 26), b = P(x, y, 36); dot(a[0], a[1], 11, '#9FD0A0'); dot(b[0], b[1], 7, '#B9DEB8');
  } });
  plant(0.6, 3.5); plant(C - 0.6, 3.5); plant(0.6, 5.6); plant(C - 0.6, 5.6);
  items.push({ d: C / 2 + 5.3, fn: () => { box(C / 2 - 0.6, 5.2, 1.2, 0.4, 3, 8, COLORS.oak); box(C / 2 - 0.55, 5.25, 0.1, 0.3, 8, 0, '#222222'); box(C / 2 + 0.45, 5.25, 0.1, 0.3, 8, 0, '#222222'); } });   // banc
  items.push({ d: C - 2 + 3.4, fn: () => {                                                                                                          // distributeur
    box(C - 2.2, 3.1, 0.7, 0.5, 46, 0, COLORS.navy);
    poly([P(C - 2.1, 3.6, 22), P(C - 1.7, 3.6, 22), P(C - 1.7, 3.6, 40), P(C - 2.1, 3.6, 40)], COLORS.yellow, true);
  } });
  items.push({ d: 4.4 + 3.4, fn: () => { box(4.3, 3.1, 0.42, 0.42, 34, 0, '#FFFFFF'); const b = P(4.51, 3.31, 46); dot(b[0], b[1], 7, '#9ED2F2'); } });   // fontaine à eau
  const palm = (x, y) => items.push({ d: x + y, fn: () => {
    box(x - 0.18, y - 0.18, 0.36, 0.36, 12, 0, COLORS.navy); box(x - 0.04, y - 0.04, 0.08, 0.08, 34, 12, COLORS.oak);
    for (let k = 0; k < 6; k++) { const a = k / 6 * 6.2832, q = P(x + Math.cos(a) * 0.28, y + Math.sin(a) * 0.28, 52 - (k % 2) * 5); dot(q[0], q[1], 7, k % 2 ? '#9FD0A0' : '#7FBF8A'); }
    const c = P(x, y, 58); dot(c[0], c[1], 7, '#B9DEB8');
  } });
  palm(3.4, 3.3); palm(8.6, 3.3);
  for (const lx of [0.45, C - 0.45]) items.push({ d: lx + 4.6, fn: () => {   // lampadaires d'intérieur
    box(lx - 0.05, 4.55, 0.1, 0.1, 66, 0, '#2A2F3B'); const g = P(lx, 4.6, 70); dot(g[0], g[1], 8, '#FFF3B0'); glow(g[0], g[1], 30 * view.s, 0.4); addLight(g[0], g[1], 100 * view.s, 0.6);
  } });
  const people = 3 + state.floor * 2, cols = [COLORS.navy, COLORS.yellow, '#FFFFFF', '#9AA3B5'];
  for (let i = 0; i < people; i++) {
    const sp = 0.45 + ((i * 37) % 5) * 0.11, dir = i % 2 ? 1 : -1, lane = 3.6 + (i % 3) * 0.8, m = (t * sp + i * 3.1) % (C + 2);
    const x = dir > 0 ? m - 1 : C + 1 - m;
    items.push({ d: x + lane, fn: () => person(x, lane, cols[i % 4], t + i, i + 2) });
  }
  return items;
}

/* ---------- lumière : cycle jour / nuit lié à l'horloge du jeu ---------- */
let NIGHT = 0, DUSK = 0;
const lights = [];                                   // points lumineux collectés pendant le dessin, rendus après la teinte de nuit
function updateLight() {
  const h = hourNow();
  NIGHT = h >= 7 && h <= 18 ? 0 : h > 18 && h < 21 ? (h - 18) / 3 : h >= 21 || h < 5 ? 1 : 1 - (h - 5) / 2;
  DUSK = Math.max(0, 1 - Math.abs(h - 19) / 2, 1 - Math.abs(h - 6) / 1.5);
}
function addLight(sx, sy, r, a) { lights.push([sx, sy, r, a]); }
function drawTint() {
  if (NIGHT > 0.01) { ctx.fillStyle = `rgba(12,22,58,${(0.42 * NIGHT).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
  if (DUSK > 0.01) { ctx.fillStyle = `rgba(255,140,50,${(0.13 * DUSK).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
}
function drawLights() {
  if (NIGHT > 0.04) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const [x, y, r, a] of lights) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(255,205,100,${(a * NIGHT * 0.6).toFixed(3)})`); g.addColorStop(1, 'rgba(255,170,40,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }
  lights.length = 0;
}
const hsh = (a, b) => (((a * 73856093) ^ (b * 19349663)) >>> 0) % 100;
const winCol = (a, b, dayCol) => (NIGHT > 0.35 ? (hsh(a, b) < 62 ? '#FFD95A' : '#1F2D57') : dayCol);   // la nuit, la plupart des fenêtres s'allument

/* fenêtres du mur de gauche + rais de soleil au sol (la position du soleil suit l'heure) */
const WINDOWS = [[3.4, 5.6, 36, 132], [0.7, 2.3, 106, 152], [6.7, 8.3, 106, 152]];   // [y0, y1, z bas, z haut]
function sunPatches() {
  const h = hourNow(), C = GRID.cols, R = GRID.rows, str = (1 - NIGHT) * Math.max(0, 1 - Math.abs(h - 12.5) / 6);
  if (str < 0.03) return;
  const k = (1.0 + 2.2 * Math.abs(h - 12.5) / 5.5) / 100;
  ctx.save();
  ctx.beginPath(); [P(0, 0), P(C, 0), P(C, R), P(0, R)].forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.closePath(); ctx.clip();
  for (const [y0, y1, zb, zt] of WINDOWS) {
    poly([P(k * zb, y0 + 0.45 * k * zb), P(k * zb, y1 + 0.45 * k * zb), P(k * zt, y1 + 0.45 * k * zt), P(k * zt, y0 + 0.45 * k * zt)], `rgba(255,246,208,${(0.30 * str).toFixed(3)})`, false);
  }
  ctx.restore();
}
function drawWindows() {
  const R = GRID.rows;
  for (const [y0, y1, zb, zt] of WINDOWS) {
    poly([P(0, y0, zb), P(0, y1, zb), P(0, y1, zt), P(0, y0, zt)], NIGHT > 0.4 ? '#1B2A55' : '#CFE4F7', true);
    if (NIGHT > 0.4) for (let i = 0; i < 7; i++) { const q = P(0, y0 + 0.2 + ((i * 37) % 10) / 10 * (y1 - y0 - 0.4), zb + 12 + ((i * 53) % 10) / 10 * (zt - zb - 24)); ctx.fillStyle = '#FFD95A'; ctx.fillRect(q[0], q[1], 2.2 * view.s, 2.2 * view.s); }
    else poly([P(0, y0 + (y1 - y0) * 0.15, zb), P(0, y0 + (y1 - y0) * 0.35, zb), P(0, y0 + (y1 - y0) * 0.8, zt), P(0, y0 + (y1 - y0) * 0.6, zt)], 'rgba(255,255,255,0.45)', false);   // reflet
    const ym = (y0 + y1) / 2, zm = (zb + zt) / 2;                                  // croisillons
    ctx.save(); ctx.strokeStyle = COLORS.ink; ctx.lineWidth = 2; ctx.beginPath();
    let a = P(0, ym, zb), b = P(0, ym, zt); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
    a = P(0, y0, zm); b = P(0, y1, zm); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); ctx.restore();
    box(0, y0 - 0.08, 0.2, y1 - y0 + 0.16, 5, zb - 5, '#FFFFFF');                 // rebord de fenêtre
  }
  // bandeau LED jaune en haut du mur (émissif)
  poly([P(0, 0, ISO.wall - 8), P(0, R, ISO.wall - 8), P(0, R, ISO.wall - 4), P(0, 0, ISO.wall - 4)], COLORS.yellow, false);

function facade(z0, z1, k) {
  const C = GRID.cols, R = GRID.rows;

  for (let i = 0.6, n = 0; i < C - 0.8; i += 1.5, n++) {

    if (NIGHT <= 0.35) poly([P(i + 0.12, R, z0 - 13), P(i + 0.3, R, z0 - 13), P(i + 0.62, R, z1 + 14), P(i + 0.44, R, z1 + 14)], 'rgba(255,255,255,0.28)', false);
    box(i - 0.05, R, 1.05, 0.12, 4, z1 + 10, '#FFFFFF');                                      // appui de fenêtre
  }
  for (let j = 0.6, n = 0; j < R - 0.8; j += 1.5, n++) {
    poly([P(C, j, z0 - 13), P(C, j + 0.95, z0 - 13), P(C, j + 0.95, z1 + 14), P(C, j, z1 + 14)], winCol(n + 20, k, shade(COLORS.screen, 0.85)), true);
  }

/* ---------- agrandissement du plateau ---------- */
function applyLand() {
  state.floor = Math.max(state.base ? -1 : 0, Math.min(state.land, state.floor | 0));
  if (W > 0) { userMoved = false; fitView(false); }
}
function buyLand() {
  const l = LANDS[state.land]; if (!l) return;
  if (state.money < l.cost) { setStatus(`Il te manque ${fmt(l.cost - state.money)} $ pour ajouter un étage.`); return false; }
  state.money -= l.cost; state.land++; state.city = false; state.floor = state.land; applyLand();
  floatText(GRID.cols / 2, 4.5, 40, 'Nouvel étage !', true);
  pop(700); setTimeout(() => pop(950), 100); setStatus(`Étage ${state.land} ajouté : tu peux y construire de nouveaux studios.`);
  updateCards(); checkGoals(); saveGame(); return true;
}

function digBase() {
  if (state.base) return false;
  if (state.money < BASE_COST) { setStatus(`Il te manque ${fmt(BASE_COST - state.money)} $ pour creuser le sous-sol.`); return false; }
  state.money -= BASE_COST; state.base = true; state.city = false; state.floor = -1; applyLand(); cancelPlacing();
  floatText(GRID.cols / 2, 3, 50, 'Sous-sol creusé !', true);
  pop(500); setTimeout(() => pop(720), 110); setTimeout(() => pop(980), 220);
  setStatus('Sous-sol ouvert : parking, voitures et 4 salles techniques à construire.');
  updateCards(); checkGoals(); saveGame(); return true;
}
function buyFac(k) {
  if (!FACS[k] || (!FACS[k].annex && !state.base)) return false;
  const lv = facLv(k);
  if (lv >= FAC_MAX) { setStatus(`${FACS[k].name} : niveau maximum.`); return false; }

  if (state.money < c) { setStatus(`Il te manque ${fmt(c - state.money)} $ pour ${FACS[k].name}.`); return false; }

  else { const r = facRect(k); floatText(r.x + r.w / 2, 2, 78, lv ? 'Niveau ' + (lv + 1) + ' !' : 'Salle ouverte !', true); }
  pop(700); setTimeout(() => pop(940), 90);

function occupied(x, y, w, d, f = state.floor) {
  for (const s of state.studios) {
    if (s.f !== f) continue;
    const o = STUDIOS[s.type];
    if (x < s.x + o.w && x + w > s.x && y < s.y + o.d && y + d > s.y) return true;
  }
  return false;
}
function ghostSpot() {
  if (!placing || !pointer.inside) return null;
  const def = STUDIOS[placing], g = toGrid(pointer.x, pointer.y);
  const x = Math.max(0, Math.min(GRID.cols - def.w, Math.round(g.gx - def.w / 2)));

/* enveloppe convexe d'un studio (sol + sommet) pour savoir sur quoi on clique */
function hull(points) {
  const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]), cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);

  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (const q of p.slice().reverse()) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }

}

}
function refreshFacModal() {

function openStudio(id) {

    <div class="m-head">

function refreshStudioModal() {

function openSettings() {
  selectedId = null; selectedFac = null; sellArmed = false; resetArmed = false;
  openModal(`
    <div class="m-head">
      <span class="card-icon"><span class="ico" data-icon="settings"></span></span>

    <div class="m-row"><span>Studios · étages</span><b>${state.studios.length} · ${state.land + 1}${state.base ? ' + sous-sol' : ''}</b></div>
    <div class="m-row"><span>Employés · voitures</span><b>${employees()} · ${parkedCars()}</b></div>
    <div class="m-row"><span>Son</span><button class="switch pressable ${state.sound ? 'on' : ''}" id="sw-sound" data-act="sound" aria-label="Activer ou couper le son"></button></div>
    <div class="m-actions">
      <button class="btn btn-ghost pressable" id="m-reset" data-act="reset"><span class="ico" data-icon="trash" style="width:18px;height:18px;vertical-align:-3px;margin-right:6px"></span><span id="m-reset-t">Recommencer la partie</span></button>
    </div>`);
}
modalEl.addEventListener('click', (e) => {
  const ad = e.target.closest('[data-ad]');
  if (ad) { const s = studioById(selectedId); if (s) { s.ad = ad.dataset.ad; pop(600); refreshStudioModal(); saveGame(); } return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, s = studioById(selectedId);
  pop(act === 'close' ? 480 : 560);
  if (act === 'close') closeModal();
  else if (act === 'facup' && selectedFac) { buyFac(selectedFac); refreshFacModal(); }
  else if (act === 'upgrade' && s) {
    const cost = upgradeCost(s);
    if (s.level >= MAX_LEVEL) return;
    if (state.money < cost) { setStatus(`Pas assez d'argent : il manque ${fmt(cost - state.money)} $.`); return; }
    state.money -= cost; s.paid += cost; s.level++; pop(760); saveGame(); refreshStudioModal();
  } else if (act === 'sell' && s) {
    if (!sellArmed) { sellArmed = true; refreshStudioModal(); return; }
    state.money += sellValue(s); state.studios = state.studios.filter((x) => x.id !== s.id);
    state.bought[s.type] = Math.max(0, state.bought[s.type] - 1);
    setStatus(`${STUDIOS[s.type].name} vendu.`); closeModal(); updateCards(); saveGame();
  } else if (act === 'sound') { state.sound = !state.sound; el.classList.toggle('on', state.sound); saveGame(); if (state.sound) pop(600); }
  else if (act === 'reset') {
    if (!resetArmed) { resetArmed = true; $('m-reset-t').textContent = 'Confirmer : tout effacer ?'; return; }
    closeModal(); resetGame();
  }
});
overlayEl.addEventListener('click', (e) => { if (e.target === overlayEl) closeModal(); });
$('btn-settings').addEventListener('click', () => { pop(520); openSettings(); });
tapEl.addEventListener('click', doTap);
floorsEl.addEventListener('click', (e) => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  if (b.dataset.f === 'city') { state.city = true; state.cityFocus = null; if (state.floor < 0) state.floor = 0; } else { state.city = false; state.floor = +b.dataset.f; }
  selectedId = null; hoverId = null; hoverFac = null; cancelPlacing(); pop(560); userMoved = false; fitView(false); updateCards();
});
digEl.addEventListener('click', () => {
  if (state.money < BASE_COST) { pop(260); digEl.classList.remove('shake'); void digEl.offsetWidth; digEl.classList.add('shake'); } else pop(520);
  digBase();
});
expandEl.addEventListener('click', () => {
  const l = LANDS[state.land]; if (!l) return;
  if (state.money < l.cost) { pop(260); expandEl.classList.remove('shake'); void expandEl.offsetWidth; expandEl.classList.add('shake'); } else pop(520);
  buyLand();
});
window.addEventListener('keydown', (e) => { if (e.code === 'Space' && overlayEl.hidden && !e.repeat) { e.preventDefault(); doTap(); } });

'use strict';
/* ==========================================================================
   10. SAUVEGARDE (localStorage) + gains hors ligne
   ========================================================================== */
const SAVE_KEY = 'tvempire_v4';
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ...state, savedAt: Date.now() })); } catch (e) { /* stockage plein ou bloqué */ }
}
function loadGame() {
  let raw = null; try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return; }
  if (!raw) return;
  try {
    const o = JSON.parse(raw);
    state.money = Number.isFinite(o.money) ? o.money : START.money;
    state.clock = Number.isFinite(o.clock) ? o.clock : START.minutes;
    state.nextId = (o.nextId | 0) || 1; state.sound = o.sound !== false;
    state.base = !!o.base; state.fac = zeroFac();
    for (const k of Object.keys(FACS)) { const v = Math.max(0, Math.min(FAC_MAX, ((o.fac || {})[k]) | 0)); state.fac[k] = (FACS[k].annex || state.base) ? v : 0; }
    state.scoops = o.scoops | 0; state.city = false; state.lots = {}; for (const id of Object.keys(o.lots || {})) { const e = o.lots[id]; if (LOT_BY_ID[id] && e && LOT_TYPES[e.t]) state.lots[id] = { t: e.t, l: Math.max(1, Math.min(LOT_MAX, e.l | 0)) }; }
    state.land = Math.max(0, Math.min(LANDS.length, o.land | 0)); state.floor = o.floor | 0; applyLand(); state.taps = o.taps | 0; state.earned = +o.earned || 0; state.started = !!o.started;
    state.done = {};
    if (Array.isArray(o.done)) o.done.forEach((v, i) => { if (v && OLD_GOAL_IDS[i]) state.done[OLD_GOAL_IDS[i]] = true; });   // ancienne sauvegarde : objectifs par rang
    else if (o.done && typeof o.done === 'object') for (const g of GOALS) if (o.done[g.id]) state.done[g.id] = true;
    state.bought = { ...zeroBought(), ...(o.bought || {}) };
    state.studios = (Array.isArray(o.studios) ? o.studios : []).filter((s) => STUDIOS[s.type]).map((s) => ({
      id: s.id, type: s.type, x: s.x | 0, y: s.y | 0, f: Math.max(0, Math.min(LANDS.length, s.f | 0)), level: Math.max(1, Math.min(MAX_LEVEL, (s.level | 0) || 1)), ad: ADS[s.ad] ? s.ad : 'standard', paid: s.paid || STUDIOS[s.type].price
    }));

}
function resetGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignoré */ }
  state.money = START.money; state.clock = START.minutes; state.studios = []; state.bought = zeroBought(); state.nextId = 1; state.land = 0; state.floor = 0; state.base = false; state.fac = zeroFac(); state.scoops = 0; state.city = false; state.cityFocus = null; state.lots = {}; applyLand();
  state.taps = 0; state.earned = 0; state.done = {}; state.started = false; giveStarter();
  placing = null; selectedId = null; stageEl.classList.remove('placing'); updateCards(); setStatus(HINT, true);
}

/* ==========================================================================
   11. BOUCLE PRINCIPALE
   ========================================================================== */
let camKeyLast = '';
/* un pas d'économie : l'horloge avance, les studios rapportent */
function step(dt) {
  state.clock += dt * (1440 / DAY_SECONDS);
  const gain = totalRevenue() * dt; state.money += gain; state.earned += gain;
}
/* le joueur était absent (onglet en arrière-plan ou jeu fermé) : le temps a passé, les studios ont rapporté la moitié */
function applyAway(secs) {
  secs = Math.min(OFFLINE_CAP_S, secs); if (!(secs > 30)) return 0;
  const avg = state.studios.length ? totalRevenue() / Math.max(0.1, timeFactor(hourNow())) : 0;   // revenu moyen sur une journée
  const gain = avg * secs * offlineRatio();
  state.clock += secs * (1440 / DAY_SECONDS);
  state.money += gain; state.earned += gain;

  return gain;
}
let last = performance.now(), hudAcc = 0, saveAcc = 0, popAcc = 0, prevH = 8, popN = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(0.25, (now - last) / 1000)); last = now;
  step(dt);
  hudAcc += dt; saveAcc += dt; popAcc += dt;
  if (!scoop && now > nextScoop && state.studios.length && overlayEl.hidden && !document.hidden) spawnScoop();
  const camKey = state.studios.length + '|' + state.floor + '|' + state.land + '|' + state.city + '|' + state.cityFocus;
  if (camKey !== camKeyLast) { camKeyLast = camKey; userMoved = false; fitView(false); }
  if (!userMoved) { const k = 1 - Math.exp(-dt * 5); view.x += (viewT.x - view.x) * k; view.y += (viewT.y - view.y) * k; view.s += (viewT.s - view.s) * k; }
  if (popAcc >= 1.2) {   // petits "+x $" au-dessus de chaque studio : on voit l'argent rentrer
    popAcc = 0; const h = hourNow(), aud = totalAudience(h);
    for (const s of state.studios) { if (s.f !== state.floor || state.city) continue; const t = studioTop(s); floatText(t.gx, t.gy, t.z, '+' + fmtRate(studioRevenue(s, h, aud)), false); }
    if (state.floor < 0 && (popN++ % 4 === 0)) for (const k of FAC_ORDER) if (facLv(k)) { const r = facRect(k); floatText(r.x + r.w / 2, 2, 70, FACS[k].short, false); }
  }
  const hNow = hourNow();
  if (prevH < 19 && hNow >= 19) { setStatus('Prime time ! L\'audience est au maximum jusqu\'à 22 h.'); pop(760); }
  if (prevH > hNow) setStatus(`Jour ${dayNow()} : une nouvelle journée commence.`);
  prevH = hNow;
  if (hudAcc >= 0.1) { hudAcc = 0; checkGoals(); updateTopbar(); updateCards(); if (!overlayEl.hidden && selectedId) refreshStudioModal(); if (!overlayEl.hidden && selectedFac) refreshFacModal(); }
  if (saveAcc >= 5) { saveAcc = 0; saveGame(); }

}

function init() {
  mountIcons(document);
  buildCards();
  makeFloorTexture();
  try { if (localStorage.getItem('tve_gift_10m')) { localStorage.removeItem('tve_gift_10m'); localStorage.removeItem(SAVE_KEY); } } catch (e) { /* ignoré */ }   // retire le cadeau test de 10 M : on repart de l'argent de départ

  if (!state.started) giveStarter();
  resize();
  if (statusEl.textContent === '') setStatus(HINT, true);
  updateCards(); updateTopbar();
  new ResizeObserver(() => { resize(); if (W > 0) fitView(!userMoved); }).observe(stageEl);
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => { if (document.hidden) { hiddenAt = Date.now(); saveGame(); } else { last = performance.now(); if (hiddenAt) { applyAway((Date.now() - hiddenAt) / 1000); hiddenAt = 0; } } });
  window.addEventListener('pagehide', saveGame);
  window.TVE = { LOTS, LOT_ORDER, buildLot, upgradeLot, pickLot, lotBonus, lotBuilt, focusCity: (k) => focusCity(k), spawnScoop, hitScoop, ANNEX_ORDER, pickAnnex, setCity: (v) => { state.city = !!v; if (v && state.floor < 0) state.floor = 0; userMoved = false; fitView(false); updateCards(); }, digBase, buyFac, FACS, FAC_ORDER, facLv, facCost, employees, parkedCars, openFac, pickFac, go: (f) => { state.floor = f; applyLand(); updateCards(); }, step, applyAway, buyLand, buy: buyStudio, tap: doTap, GOALS, state, STUDIOS, ADS, view, place: placeStudio, openStudio, openSettings, closeModal, fmt, totalRevenue, totalAudience, hourNow, nextPrice, upgradeCost, startPlacing, saveGame };   // accès pratique pour les tests
  requestAnimationFrame(frame);
}
init();
