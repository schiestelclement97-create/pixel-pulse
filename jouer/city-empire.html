<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>City Empire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
/* Layout: plein écran = la carte isométrique ; HUD en verre fumé épinglé haut/bas ; panneaux de gestion qui glissent depuis la droite */
--bg:#0e1723;--glass:rgba(13,22,35,.9);--panel:#152234;--raise:#1f3048;--raise2:#29405f;--line:rgba(160,186,220,.16);
--ink:#eef3fa;--mute:#93a5bc;--brass:#f2b84b;--brass2:#ffd58a;--brass-ink:#2a1c04;--civic:#5aa9ff;--good:#4fd18b;--warn:#ffb648;--bad:#ff6d6d;
--fd:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
--fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
--fm:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
--topH:58px;
color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:7px 9px;user-select:text;-webkit-user-select:text}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
/* ---- top bar ---- */
.top{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;gap:10px;align-items:center;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(rgba(13,22,35,.95),rgba(13,22,35,.82));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1;white-space:nowrap}
.brand b{font-family:var(--fd);font-weight:800;font-size:18px;letter-spacing:.01em}
.brand small{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin-top:4px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.chip{display:flex;flex-direction:column;justify-content:center;padding:4px 10px;border-radius:9px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;flex:none}
.chip b{font-family:var(--fm);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.chip span{font-size:9.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.chip.pos b{color:var(--good)}.chip.neg b{color:var(--bad)}
.chip.money{background:linear-gradient(135deg,#2b2410,#1d2a3c);border-color:rgba(242,184,75,.35)}
.chip.money b{color:var(--brass2);font-size:14px}
.tctl{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.tctl button{min-width:34px;height:30px;border-radius:7px;font-family:var(--fm);font-size:12px;font-weight:700;color:var(--mute)}
.tctl button.on{background:var(--brass);color:var(--brass-ink)}
.tctl button:hover:not(.on){background:var(--raise);color:var(--ink)}
.tbtns{display:flex;gap:4px;flex:none}
.ibtn{height:36px;padding:0 11px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px;position:relative;white-space:nowrap}
.ibtn:hover{background:var(--raise)}
.ibtn .dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--brass);color:var(--brass-ink);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.date{font-family:var(--fm);font-size:11px;color:var(--mute);white-space:nowrap;text-align:right;line-height:1.3}
.date b{color:var(--ink);display:block;font-size:12px}
/* ---- dock ---- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none;padding-top:8px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .bar{pointer-events:auto;display:flex;gap:3px;padding:5px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 10px;border-radius:11px;min-width:78px;font-weight:600;font-size:11.5px;color:var(--mute);flex:none}
.dbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dbtn:hover{background:var(--raise);color:var(--ink)}
.dbtn.on{background:var(--brass);color:var(--brass-ink)}
/* ---- drawer (catalogue) ---- */
.drawer{position:fixed;z-index:25;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.drawer .in{pointer-events:auto;width:min(1080px,100%);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:10px 10px 12px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.tab{padding:6px 12px;border-radius:999px;font-weight:600;font-size:12.5px;color:var(--mute);white-space:nowrap;border:1px solid transparent}
.tab.on{background:var(--raise2);color:var(--ink);border-color:var(--line)}
.tab:hover:not(.on){color:var(--ink)}
.cards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.card{flex:none;width:136px;border-radius:12px;background:var(--panel);border:1px solid var(--line);padding:6px 6px 8px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative}
.card:hover{border-color:rgba(242,184,75,.55);background:var(--raise)}
.card.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.card img{width:124px;height:86px;object-fit:contain;border-radius:8px;background:radial-gradient(ellipse at 50% 80%,#2b4566,#16243a)}
.card .nm{font-weight:700;font-size:12.5px;line-height:1.2;min-height:30px}
.card .pr{font-family:var(--fm);font-size:12px;color:var(--brass2)}
.card .mt{font-size:10.5px;color:var(--mute);line-height:1.3}
.card.lock{opacity:.55}
.card.lock .lk{position:absolute;inset:6px 6px auto 6px;height:86px;border-radius:8px;background:rgba(10,16,26,.72);display:grid;place-items:center;text-align:center;font-size:10.5px;font-weight:600;color:var(--ink);padding:6px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:104px;height:104px;flex:none;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:12px;text-align:center;padding:6px}
.tool:hover{background:var(--raise)}
.tool.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.tool i{display:block;width:38px;height:24px;border-radius:5px}
.tool small{font-family:var(--fm);color:var(--brass2);font-size:11px}
/* ---- hint ---- */
.hint{position:fixed;z-index:26;left:50%;transform:translateX(-50%);top:calc(var(--topH) + 8px);background:var(--glass);border:1px solid rgba(242,184,75,.5);border-radius:999px;padding:6px 8px 6px 14px;display:flex;gap:10px;align-items:center;font-size:12.5px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.hint b{color:var(--brass2)}
.hint button{background:var(--raise);border-radius:999px;padding:5px 11px;font-weight:700;font-size:12px}
/* ---- side tools ---- */
.side{position:fixed;z-index:22;left:max(16px,env(safe-area-inset-left,0px));top:calc(var(--topH) + 12px);display:flex;flex-direction:column;gap:6px;width:148px}
.box{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.box h4{margin:0 0 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.box select{width:100%;padding:5px 6px;font-size:12px}
.rci{display:flex;gap:8px;align-items:flex-end;height:56px;padding:0 4px}
.rci div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.rci .bar{width:100%;height:42px;background:var(--raise);border-radius:4px;position:relative;overflow:hidden}
.rci .bar i{position:absolute;left:0;right:0;bottom:50%;border-radius:2px}
.rci span{font-family:var(--fm);font-size:10px;font-weight:700}
.camb{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.camb button{height:30px;border-radius:7px;background:var(--raise);font-weight:700;font-size:14px}
.camb button:hover{background:var(--raise2)}
.prof{font-size:11.5px;font-weight:700;color:var(--brass2);line-height:1.25}
#mini{position:fixed;z-index:22;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:184px;height:100px;border-radius:12px;background:var(--glass);border:1px solid var(--line);cursor:pointer}
/* ---- sheet ---- */
.sheet{position:fixed;z-index:40;top:calc(var(--topH) + 6px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px));width:min(480px,calc(100% - 32px));background:rgba(15,25,39,.97);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet h2{margin:0;font-family:var(--fd);font-weight:800;font-size:22px;letter-spacing:-.01em}
.xbtn{width:34px;height:34px;border-radius:9px;background:var(--raise);font-size:18px;font-weight:700}
.sheet .body{overflow-y:auto;padding:12px 16px 20px;flex:1;min-height:0}
.sec{margin:14px 0 6px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi span{display:block;font-size:10.5px;color:var(--mute);font-weight:600}
.kpi b{font-family:var(--fm);font-size:15px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed rgba(160,186,220,.1);font-size:13px}
.row:last-child{border-bottom:0}
.row .v{font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap}
.g{color:var(--good)}.r{color:var(--bad)}.w{color:var(--warn)}.m{color:var(--mute)}.a{color:var(--brass2)}
.btn{background:var(--raise2);border-radius:8px;padding:7px 11px;font-weight:700;font-size:12.5px;white-space:nowrap;border:1px solid var(--line)}
.btn:hover{background:#34507a}
.btn.pri{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.btn.pri:hover{background:var(--brass2)}
.btn.bad{background:rgba(255,109,109,.15);color:#ffb0b0;border-color:rgba(255,109,109,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item h3{margin:0;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--raise2);color:var(--ink)}
.pill.g{background:rgba(79,209,139,.16);color:var(--good)}.pill.a{background:rgba(242,184,75,.16);color:var(--brass2)}.pill.r{background:rgba(255,109,109,.16);color:var(--bad)}.pill.b{background:rgba(90,169,255,.16);color:#9ccaff}
.prog{height:7px;background:var(--raise);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass2));border-radius:4px}
.prog.gr i{background:linear-gradient(90deg,#2fae6c,var(--good))}
.hbar{display:grid;grid-template-columns:104px 1fr 42px;gap:8px;align-items:center;font-size:12px;padding:3px 0}
.hbar .t{height:8px;background:var(--raise);border-radius:4px;overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:4px}
.chart{width:100%;height:120px;display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.small{font-size:11.5px;color:var(--mute);line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
input[type=range]{width:100%;padding:0;accent-color:var(--brass);background:none;border:0}
textarea{width:100%;min-height:80px;font-family:var(--fm);font-size:11px;background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;user-select:text;-webkit-user-select:text;box-sizing:border-box}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
tr.me td{color:var(--brass2);font-weight:700}
/* ---- inspector ---- */
.insp{position:fixed;z-index:35;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:min(340px,calc(100% - 32px));max-height:calc(100% - 200px);overflow-y:auto;background:rgba(15,25,39,.97);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.5);padding:12px 14px}
.insp .hd{display:flex;gap:10px;align-items:center}
.insp img{width:84px;height:64px;object-fit:contain;border-radius:10px;background:radial-gradient(ellipse at 50% 80%,#2b4566,#16243a);flex:none}
.insp h3{margin:0;font-family:var(--fd);font-size:18px;font-weight:800;line-height:1.1}
.insp .sub{font-size:11.5px;color:var(--mute);margin-top:3px}
/* ---- toasts / modal ---- */
.toasts{position:fixed;z-index:60;top:calc(var(--topH) + 12px);right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;width:min(320px,calc(100% - 32px))}
.toast{background:rgba(18,30,47,.97);border:1px solid var(--line);border-left:3px solid var(--civic);border-radius:10px;padding:9px 12px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .25s ease-out}
.toast.good{border-left-color:var(--good)}.toast.bad{border-left-color:var(--bad)}.toast.gold{border-left-color:var(--brass)}
@keyframes tin{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;z-index:70;background:rgba(6,11,19,.6);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .in{width:min(520px,100%);background:#14223a;border:1px solid rgba(242,184,75,.35);border-radius:18px;padding:20px 20px 18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal .eb{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.modal h2{font-family:var(--fd);font-weight:800;font-size:24px;margin:6px 0 8px;line-height:1.15;text-wrap:balance}
.modal p{color:#c9d5e4;line-height:1.5;margin:0 0 14px}
.modal .ch{display:flex;flex-direction:column;gap:8px}
.modal .ch button{text-align:left;padding:11px 14px;border-radius:11px;background:var(--raise);border:1px solid var(--line);font-weight:600;line-height:1.35}
.modal .ch button:hover{background:var(--raise2);border-color:rgba(242,184,75,.5)}
.modal .ch button small{display:block;color:var(--mute);font-weight:500;font-size:12px;margin-top:2px}
/* ---- start ---- */
.start{position:fixed;inset:0;z-index:80;display:flex;align-items:center;background:linear-gradient(90deg,rgba(8,14,24,.94) 0%,rgba(8,14,24,.82) 45%,rgba(8,14,24,.15) 100%);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.start .in{width:min(470px,100%);padding:30px 0 30px clamp(0px,4vw,60px)}
.start .ov{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.start h1{font-family:var(--fd);font-weight:800;font-size:clamp(46px,9vw,82px);line-height:.9;margin:10px 0 6px;letter-spacing:-.03em}
.start h1 em{font-style:normal;color:var(--brass)}
.start .tag{font-family:var(--fd);font-size:20px;font-weight:600;color:#cfdbea;margin-bottom:22px}
.start p{color:#b8c6d8;line-height:1.55;margin:0 0 18px;max-width:52ch}
.start label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:12px 0 6px}
.start input{width:100%;box-sizing:border-box;font-size:15px;padding:10px 12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:9px 6px;border-radius:9px;background:var(--raise);border:1px solid var(--line);font-weight:700;font-size:12.5px;line-height:1.25}
.seg button small{display:block;font-family:var(--fm);font-weight:500;color:var(--mute);font-size:11px}
.seg button.on{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.seg button.on small{color:#5a3f0c}
.start .go{margin-top:18px;width:100%;padding:14px;border-radius:12px;background:var(--brass);color:var(--brass-ink);font-family:var(--fd);font-weight:800;font-size:18px}
.start .go:hover{background:var(--brass2)}
.slots{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);text-align:left}
.slot:hover{border-color:rgba(242,184,75,.5)}
.slot small{color:var(--mute);font-size:11.5px;display:block}
@media (max-width:760px){
 .top{flex-wrap:wrap;row-gap:6px}.brand{display:none}.stats{order:5;flex-basis:100%}.tctl{margin-right:auto}
 .tctl button{min-width:30px}.ibtn{padding:0 9px}
 .side{display:none}#mini{display:none}
 .dbtn{min-width:62px;padding:7px 6px;font-size:10.5px}
 .brand small{display:none}
 .date{display:none}
 .ibtn .lbl{display:none}
 .drawer{bottom:calc(env(safe-area-inset-bottom,0px) + 78px)}
 .insp{bottom:calc(env(safe-area-inset-bottom,0px) + 80px);max-height:52%}
 .sheet{width:calc(100% - 32px)}
 .start{background:rgba(8,14,24,.88)}
}
@media (max-width:760px){.mobside{display:flex!important}}
.mobside{display:none;position:fixed;z-index:22;right:max(16px,env(safe-area-inset-right,0px));top:calc(var(--topH) + 12px);flex-direction:column;gap:5px}
.mobside button{width:38px;height:38px;border-radius:10px;background:var(--glass);border:1px solid var(--line);font-weight:800;font-size:16px}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

function genMap(seed){
 const r=mulberry(seed);
 const G=sc=>{const n=Math.ceil(N/sc)+3,g=[];for(let i=0;i<n*n;i++)g.push(r());return(x,y)=>{const fx=x/sc,fy=y/sc,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy,s=t=>t*t*(3-2*t);const a=g[iy*n+ix],b=g[iy*n+ix+1],c=g[(iy+1)*n+ix],d=g[(iy+1)*n+ix+1],u=s(tx),v=s(ty);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}};
 const n1=G(9),n2=G(4),n3=G(13),n4=G(6);
 ter=new Uint8Array(N*N);elev=new Float32Array(N*N);tshade=new Float32Array(N*N);
 road=new Uint8Array(N*N);zone=new Uint8Array(N*N);bid=new Int32Array(N*N).fill(-1);
 owned=new Uint8Array(NC*NC);
 const riverX=[];let rx=52+r()*3;
 for(let y=0;y<N;y++){rx+=Math.sin(y*.17+seed%7)*.75+(r()-.5)*.6;rx=clamp(rx,49,58);riverX.push(rx);}
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const i=y*N+x,h=n1(x,y)*.65+n2(x,y)*.35;tshade[i]=n2(x,y);let t=GRASS;
  const seaLine=N-6-n3(x,y)*5;
  if(y>seaLine){t=WATER;elev[i]=1;}else if(y>seaLine-2.4)t=SAND;
  const rw=y>56?2.3:1.45;
  if(Math.abs(x-riverX[y])<rw&&t!==SAND){t=WATER;}
  if(Math.abs(x-riverX[y])<rw&&t===SAND){t=WATER;elev[i]=1;}
  const ld=Math.hypot((x-13)/1.2,y-15)-(5+n2(x,y)*3);
  if(ld<0)t=WATER;else if(ld<1.3&&t===GRASS)t=SAND;
  const mt=(1-y/20)*.95+h*.6-(Math.abs(x-36)<12?.45:0);
  if(t===GRASS&&y<21&&mt>.85){t=MOUNT;elev[i]=clamp((mt-.85)*2.2,0,1);}
  if(t===GRASS&&n4(x+40,y+11)*.7+n2(x,y)*.3>.6)t=FOREST;
  ter[i]=t;
 }
 for(let y=24;y<48;y++)for(let x=24;x<48;x++){const i=y*N+x;if(ter[i]===FOREST&&r()>.25)ter[i]=GRASS;}
 for(let y=29;y<41;y++)for(let x=26;x<42;x++){const i=y*N+x;if(ter[i]!==WATER)ter[i]=GRASS;}
 for(let x=0;x<27;x++){const i=35*N+x;if(ter[i]===FOREST||ter[i]===MOUNT)ter[i]=GRASS;road[i]=4;}
 for(let cy=3;cy<=5;cy++)for(let cx=3;cx<=5;cx++)owned[cy*NC+cx]=1;
 nearW=new Uint8Array(N*N);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){let w=0;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<N&&Y<N&&ter[Y*N+X]===WATER)w=1;}nearW[y*N+x]=w;}
 computeColors();
}
function tileColor(i){
 const t=ter[i],s=tshade[i];
 const mix=(a,b,f)=>{const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const ch=k=>Math.round(((pa>>k)&255)*(1-f)+((pb>>k)&255)*f);return `rgb(${ch(16)},${ch(8)},${ch(0)})`;};
 if(t===WATER)return elev[i]?mix('#2a7fb8','#2f8fca',s):mix('#3c9fd2','#47abdc',s);
 if(t===SAND)return mix('#e7d29a','#efdcab',s);
 if(t===MOUNT)return mix('#8e8a77','#a19c88',s);
 if(t===FOREST)return mix('#4f8e3f','#5c9b47',s);
 return mix('#78b257','#8cc163',s);
}
function computeColors(){tcol=new Array(N*N);for(let i=0;i<N*N;i++)tcol[i]=tileColor(i);}
const chunkOf=(x,y)=>(y>>3)*NC+(x>>3);
const isOwned=(x,y)=>x>=0&&y>=0&&x<N&&y<N&&owned[chunkOf(x,y)]===1;

function addB(t,x,y,owner,o){

 for(let j=y;j<y+s;j++)for(let i=x;i<x+s;i++){const k=j*N+i;bid[k]=id;zone[k]=d.zone||0;if(ter[k]===FOREST){ter[k]=GRASS;tcol[k]=tileColor(k);}}

 if(B[b.t].zone){zone[b.y*N+b.x]=B[b.t].zone;}
 fieldsDirty=true;zoneDirty=true;if(sel===b.id)closeInsp();
}
function isConnectedB(b){
 if(!conn)return false;
 for(let j=b.y-1;j<=b.y+b.s;j++)for(let i=b.x-1;i<=b.x+b.s;i++){
  if(i<0||j<0||i>=N||j>=N)continue;const inX=i>=b.x&&i<b.x+b.s,inY=j>=b.y&&j<b.y+b.s;if(inX&&inY)continue;if((i<b.x||i>=b.x+b.s)&&(j<b.y||j>=b.y+b.s))continue;
  if(conn[j*N+i])return true;}
 return false;
}
function capOf(b){const d=B[b.t];if(d.cat!=='res')return 0;if(d.zone)return Z.zr.cap[b.lvl-1];return d.cap*LM[b.lvl-1];}
function jobsCap(b){const d=B[b.t];if(d.zone===2)return Z.zc.jobs[b.lvl-1];if(d.zone===3)return Z.zi.jobs[b.lvl-1];return (d.jobs||0)*LM[b.lvl-1];}
function jobsOf(b){return b.owner==='player'?jobsCap(b)*b.hp:jobsCap(b);}
function revBase(b){const d=B[b.t];if(d.zone===2)return Z.zc.R[b.lvl-1];if(d.zone===3)return Z.zi.R[b.lvl-1];return (d.R||0)*LM[b.lvl-1];}
function districtPol(x,y){const c=S.districts[chunkOf(x,y)];return c?c.p:'none';}
function polOf(b){const d=B[b.t];let p=d.zone===3?Z.zi.pol[b.lvl-1]:(d.pol||0)*(1+.2*(b.lvl-1));if((d.cat==='ind')&&S.techs.filters)p*=.6;if(districtPol(b.x,b.y)==='vert')p*=.6;return p;}
function valueOf(b){const d=B[b.t];if(d.zone)return Z[b.t].val[b.lvl-1];let v=d.cost;for(let l=1;l<b.lvl;l++)v+=upgCost(b,l);return v;}
function upgCost(b,l){const d=B[b.t];const base=d.zone?Z[b.t].val[0]*1.5:d.cost;return Math.round(base*.55*(l||b.lvl));}
function lvlName(b){const d=B[b.t];if(d.zone)return Z[b.t].n[b.lvl-1];return (LVN[d.cat]||LVN.svc)[b.lvl-1];}
function bName(b){const d=B[b.t];if(d.zone)return Z[b.t].n[b.lvl-1];return b.nm||d.n;}
function clsOf(b){return b.cls||B[b.t].cls||'fam';}
function matCost(t){const d=B[t];return Math.round(d.cost/450*(S.techs.recycle?.75:1));}
function matPrice(){return S.matPrice*eff('mat');}

/* ---------- EFFETS ---------- */
function eff(k){let v=1;for(const e of S.effects)if(e.k===k&&!e.add)v*=e.v;return v;}
function effAdd(k){let v=0;for(const e of S.effects)if(e.k===k&&e.add)v+=e.v;return v;}
function addEff(k,v,dur,add,label){S.effects.push({k,v,until:S.day+dur,add:!!add,label});}

/* ---------- CONNEXION / CHAMPS ---------- */
function computeConn(){
 conn=new Uint8Array(N*N);const q=[];roadList=[];
 for(let i=0;i<N*N;i++)if(road[i])roadList.push(i);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){if((x===0||y===0||x===N-1||y===N-1)&&road[y*N+x]){conn[y*N+x]=1;q.push(y*N+x);}}
 while(q.length){const k=q.pop(),x=k%N,y=(k/N)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=N||Y>=N)continue;const kk=Y*N+X;if(road[kk]&&!conn[kk]){conn[kk]=1;q.push(kk);}}}
 for(const b of BS)b.connected=isConnectedB(b);
}
function computeFields(){
 for(const k of ['pol','edu','health','police','fire','leis','admin','lv','tour'])F[k]=new Float32Array(N*N);
 const add=(cx,cy,r,fn)=>{const R=Math.ceil(r);for(let y=Math.max(0,Math.floor(cy-R));y<=Math.min(N-1,Math.ceil(cy+R));y++)for(let x=Math.max(0,Math.floor(cx-R));x<=Math.min(N-1,Math.ceil(cx+R));x++){const d=Math.hypot(x+.5-cx,y+.5-cy);if(d<=r)fn(y*N+x,1-d/r);}};
 let polG=0;
 for(const b of BS){const d=B[b.t];if(!b.active&&!d.park)continue;const cx=b.x+b.s/2,cy=b.y+b.s/2;
  if(d.polG)polG+=d.polG;
  const p=polOf(b);if(p>0)add(cx,cy,5+p*1.2,(i,f)=>F.pol[i]+=p*f*1.3);
  if(d.polR)add(cx,cy,(d.rad||6)+2,(i,f)=>F.pol[i]+=d.polR*f);
  if(d.svc){let r=d.rad*(1+.12*(b.lvl-1));if(d.svc==='health'&&S.techs.medic)r*=1.3;const st=.75+.08*b.lvl;add(cx,cy,r,(i,f)=>{const v=Math.min(1,st*(.45+.75*f));if(v>F[d.svc][i])F[d.svc][i]=v;});}
  if(d.leis){const r=(d.rad||8)*(1+.1*(b.lvl-1));add(cx,cy,r,(i,f)=>F.leis[i]=Math.min(1.2,F.leis[i]+d.leis*(.3+.5*f)));}
  if(d.tour||d.rep)add(cx,cy,10,(i,f)=>F.tour[i]+=f*((d.tour||0)/20+(d.rep||0)/4));
 }
 // pollution du trafic
 if(!S.techs.ev&&D.cong>0)for(const k of roadList)F.pol[k]+=.4*D.cong*(road[k]===4?2:1);
 const gm=Math.max(.3,1-polG);
 for(let i=0;i<N*N;i++){
  let p=Math.max(0,F.pol[i]*gm);const x=i%N,y=(i/N)|0;
  const pl=districtPol(x,y);if(pl==='calme')p*=.7;F.pol[i]=p;
  let lv=22+12*F.edu[i]+12*F.health[i]+10*F.police[i]+16*Math.min(1,F.leis[i])+8*F.admin[i]+(nearW[i]?12:0)+Math.min(15,F.tour[i]*4)-p*5.5+(pl==='luxe'?15:0)+S.stage*2;
  F.lv[i]=clamp(lv,0,100);
 }
}

function simTick(){
 S.day++;
 S.effects=S.effects.filter(e=>e.until>S.day);
 for(const b of BS){if(b.anim<1)b.anim=Math.min(1,b.anim+.34);}
 if(dirtyConn){computeConn();dirtyConn=false;fieldsDirty=true;}
 for(const b of BS){const d=B[b.t];b.active=(d.park||b.connected)&&!b.dmg;}
 if(fieldsDirty||S.day%4===0){computeFields();fieldsDirty=false;}
 const T=S.techs, st=S.stage;
 const inc={},exp={};const ad=(o,k,v)=>{if(v)o[k]=(o[k]||0)+v;};
 let pC=0,pP=0,wC=0,wP=0,cap=0,jobs=0,comCap=0,tourS=0,transit=0,rs=0,mP=0,hotels=0,repB=0,wtB=0,leisB=0;
 const classes={etu:0,fam:0,tra:0,cad:0,ent:0,ais:0};
 for(const b of BS){
  const d=B[b.t];if(!b.active)continue;const lm=LM[b.lvl-1];
  const jc=jobsCap(b), cp=capOf(b);
  pC+=(cp*.06+jc*.12+(d.cat==='res'||d.park?.3:1))*(.6+.4*lm)*(T.grid?.85:1);
  wC+=(cp*.07+jc*.08+.5)*(.6+.4*lm);
  if(d.pwP)pP+=d.pwP*lm;
  if(d.wtP)wP+=d.wtP*lm;
  if(d.wtB)wtB+=d.wtB;
  if(d.cat==='res')cap+=cp;
  jobs+=jobsOf(b);
  if(d.cat==='com'&&!d.hotel)comCap+=revBase(b);
  if(d.tour)tourS+=d.tour*lm*(districtPol(b.x,b.y)==='touris'?1.3:1);
  if(d.transit)transit+=d.transit*lm;
  if(d.rs)rs+=d.rs*lm;
  if(d.mP)mP+=d.mP*lm;
  if(d.hotel)hotels+=lm;
  if(d.rep)repB+=d.rep;
 }

function deserialize(json){const o=JSON.parse(json);S=Object.assign(baseState(o.S.name,o.S.diff,o.S.seed),o.S);genMap(S.seed);
 ter=Uint8Array.from(o.ter,c=>+c);road=Uint8Array.from(o.road,c=>+c);zone=Uint8Array.from(o.zone,c=>+c);owned=Uint8Array.from(o.owned);computeColors();
 BS=[];BMAP=new Map();bid.fill(-1);for(const b of o.bs){const nb=Object.assign({anim:1},b);BS.push(nb);BMAP.set(nb.id,nb);for(let j=nb.y;j<nb.y+nb.s;j++)for(let i=nb.x;i<nb.x+nb.s;i++)bid[j*N+i]=nb.id;}
 if(o.cam)Object.assign(cam,o.cam);afterLoad();}
function saveSlot(s,notify){if(!S)return;try{const data=serialize();localStorage.setItem(KEY+s,data);localStorage.setItem(KEY+s+'.meta',JSON.stringify({name:S.name,pop:Math.round(S.pop),date:dateStr()}));if(notify)toast('Partie sauvegardée','good');}catch(e){if(notify)toast('Sauvegarde impossible dans ce navigateur : utilisez le code d’export (Menu)','bad');}}
function slotMeta(s){try{const m=localStorage.getItem(KEY+s+'.meta');return m?JSON.parse(m):null;}catch(e){return null;}}
function loadSlot(s){try{const d=localStorage.getItem(KEY+s);if(!d){toast('Emplacement vide','bad');return false;}deserialize(d);return true;}catch(e){toast('Chargement impossible','bad');return false;}}

/* ---------- PARTIE ---------- */
function baseState(name,diff,seed){return{v:1,name,diff,seed,money:[250000,100000,50000][diff],mat:200,day:0,pop:0,sat:62,rep:30,resTax:10,bizTax:10,speed:1,lastSpeed:1,rp:0,techs:{},rare:{},missions:{},misNotified:{},misReady:0,loans:[],inv:{livret:0,oblig:0,actions:0},districts:{},effects:[],hist:[],importPow:true,importWat:true,autoMat:true,matPrice:25,nextEvent:150,nid:1,stage:0,flags:{},consLog:[],noNight:false};}
function newGame(name,diff){const seed=(Math.random()*1e9)|0;S=baseState(name,diff,seed);genMap(seed);BS=[];BMAP=new Map();
 for(let cy=3;cy<=5;cy++)for(let cx=3;cx<=5;cx++)S.districts[cy*NC+cx]={n:cy===4&&cx===4?'Centre-ville':DNAMES[(cy*NC+cx)%DNAMES.length],p:'none'};
 for(let x=27;x<=41;x++)road[35*N+x]=2;for(let y=29;y<=41;y++)if(y!==35)road[y*N+32]=1;
 addB('mairie',33,33,'city');addB('generateur',29,36,'city');addB('chateau_eau',30,36,'city');
 addB('maison',33,36,'player');addB('maison',34,36,'player');addB('maison',35,36,'player');
 for(const b of BS)b.anim=1;
 for(let y=30;y<=34;y++)for(let x=28;x<=31;x++){const k=y*N+x;if(bid[k]<0&&!road[k])zone[k]=1;}
 S.pop=12;afterLoad();centerOn(33,35);cam.z=innerWidth<760?.75:1.05;
 setTimeout(()=>showModal({eb:'Bienvenue, maire',title:`Bienvenue à ${esc(name)} !`,body:`Vous démarrez avec <b class="a">${eur(S.money)}</b>, une mairie, quelques maisons et une zone résidentielle déjà tracée.<br><br><b>Pour bien commencer :</b> construisez des logements et des commerces le long des routes (menu <b>Construction</b>), tracez des zones dans <b>Routes</b> pour que des habitants et des entreprises privées s’installent seuls, puis créez vos propres sociétés dans <b>Entreprises</b>.`,choices:[{t:'Fonder ma ville',f:()=>{}}]}),300);
}
function afterLoad(){dirtyConn=true;computeConn();dirtyConn=false;for(const b of BS){const d=B[b.t];b.active=(d.park||b.connected)&&!b.dmg;}computeFields();zoneDirty=true;running=true;paused=false;modalQ=[];$('#modal').hidden=true;
 $('#start').hidden=true;$('#cityName').textContent=S.name;setSpeed(S.speed||1);CARS=[];SMOKE=[];FLOAT=[];simTickSafe();hud();if(!cam.cx&&!cam.cy)centerOn(33,35);}
function simTickSafe(){const d=S.day;S.day--;simTick();S.day=d;}

/* ---------- ÉCRAN TITRE ---------- */
let startDiff=1;
function renderStart(){const slots=['auto','1','2','3'].map(s=>[s,slotMeta(s)]).filter(x=>x[1]);
 $('#startIn').innerHTML=`<div class="ov">Simulation · Gestion · Stratégie</div><h1>CITY<br><em>EMPIRE</em></h1><div class="tag">Build your city</div>
 <p>D’un terrain presque vide à une mégapole futuriste : tracez vos routes, attirez des habitants, bâtissez vos entreprises et faites de votre ville la première du classement.</p>
 ${slots.length?`<label>Continuer</label><div class="slots">${slots.map(([s,m])=>`<button class="slot" data-act="cont" data-arg="${s}"><div><b>${esc(m.name)}</b><small>${s==='auto'?'Sauvegarde auto':'Emplacement '+s} · ${fmt(m.pop)} hab. · ${m.date}</small></div><span class="a">▶</span></button>`).join('')}</div>`:''}
 <label for="cityIn">Nom de votre ville</label><input id="cityIn" maxlength="28" value="${esc(pick(['Saint-Laurent','Belle-Rive','Port-Lumière','Nouvelle-Aube','Valclair','Mont-Azur']))}">
 <label>Difficulté</label><div class="seg">${[['Facile',250000],['Normal',100000],['Difficile',50000]].map(([n,m],i)=>`<button class="${startDiff===i?'on':''}" data-act="diff" data-arg="${i}">${n}<small>${eur(m)}</small></button>`).join('')}</div>
 <button class="go" data-act="start">Nouvelle partie</button>`;}
function showStart(){$('#start').hidden=false;closeInsp();closeDrawer();setTool(null);
 // ville de démonstration en arrière-plan
 S=baseState('Démo',1,4242);genMap(4242);BS=[];BMAP=new Map();for(let x=27;x<=41;x++)road[35*N+x]=2;for(let y=29;y<=41;y++)if(y!==35)road[y*N+32]=1;for(let x=26;x<=40;x++)road[30*N+x]=1;for(let x=26;x<=40;x++)road[40*N+x]=1;
 const demo=[['mairie',33,33],['ecole',28,36],['hopital',36,31],['imm10',29,31],['grand_imm',27,31],['tour_res',36,36],['bureaux',33,31],['ent_info',34,31],['tech',38,31],['parc',31,33],['grand_parc',30,33],['supermarche',38,36],['restaurant',34,36],['hotel',36,38],['cinema',38,38],['eolienne',40,33],['siege',33,38],['maison',28,38],['maison',29,38],['maison',30,38],['villa',27,41],['usine_alim',34,41],['stade',36,41],['chateau_eau',31,38]];
 for(const[t,x,y]of demo){let ok=true;for(let j=y;j<y+B[t].s;j++)for(let i=x;i<x+B[t].s;i++)if(bid[j*N+i]>=0||road[j*N+i])ok=false;if(ok){const b=addB(t,x,y,'city');b.anim=1;b.lvl=1+(hash(x*y)%3);}}
 S.pop=900;S.stage=3;dirtyConn=true;computeConn();dirtyConn=false;for(const b of BS)b.active=true;computeFields();running=false;centerOn(36,35);cam.z=innerWidth<760?.7:1.15;
 renderStart();}

/* ---------- MINI-CARTE ---------- */
const mini=$('#mini'),mctx=mini.getContext('2d');
function drawMini(){if(!ter||innerWidth<=760)return;const w=mini.width,h=mini.height;mctx.clearRect(0,0,w,h);const sx=w/(2*N)*.96,sy=h/(2*N)*.96,ox=w/2,oy=h*.02;
 for(let ry=0;ry<N;ry++)for(let rx=0;rx<N;rx++){const[x,y]=unrot(rx,ry);const i=y*N+x;let c=tcol[i];if(road[i])c='#555c66';else if(bid[i]>=0){const b=BMAP.get(bid[i]);c=b?(b.owner==='player'?'#f2b84b':B[b.t].cat==='res'?'#d9cbb0':B[b.t].cat==='ind'?'#c79a62':'#b8c8dc'):c;}else if(zone[i])c=ZONE_COL[zone[i]];
  mctx.fillStyle=c;mctx.fillRect(ox+(rx-ry)*sx-sx,oy+(rx+ry)*sy,sx*2+.5,sy*2+.5);if(!isOwned(x,y)){mctx.fillStyle='rgba(8,16,30,.35)';mctx.fillRect(ox+(rx-ry)*sx-sx,oy+(rx+ry)*sy,sx*2+.5,sy*2+.5);}}
 const k=sx/32;const vx=ox+(cam.cx-W/2/cam.z)*k,vy=oy+(cam.cy-H/2/cam.z)*sy/16,vw=W/cam.z*k,vh=H/cam.z*sy/16;mctx.strokeStyle='#fff';mctx.lineWidth=2;mctx.strokeRect(vx,vy,vw,vh);}
mini.addEventListener('click',e=>{const r=mini.getBoundingClientRect();const w=mini.width,h=mini.height;const mx=(e.clientX-r.left)*w/r.width,my=(e.clientY-r.top)*h/r.height;const sx=w/(2*N)*.96,sy=h/(2*N)*.96,ox=w/2,oy=h*.02;cam.cx=(mx-ox)/sx*32;cam.cy=(my-oy)/sy*16;});

/* ---------- BOUCLE ---------- */
let topH=0,last=performance.now(),acc=0,hudT=0,sheetT=0,saveT=0,miniT=0,inspT=0;
function frame(t){const dt=Math.min(.1,(t-last)/1000);last=t;TM+=dt;
 if(S&&running&&!paused&&S.speed>0){acc+=dt*S.speed;let n=0;while(acc>=1&&n<6){acc-=1;n++;S.spendTick=0;simTick();S.consLog.push(S.spendTick||0);if(S.consLog.length>60)S.consLog.shift();}}
 if(S&&!running){TM+=0;}
 if(S){const tod=(((S.day+acc)/120)%1+1)%1;NIGHT=S.noNight?0:clamp(Math.max(0,Math.sin((tod-.62)*Math.PI*2.6))*1.0,0,.82);if(!running)NIGHT=.0;}
 keyPan(dt);updateFX(dt);
 if(!running&&S){cam.cx+=dt*6;}
 render();
 hudT+=dt;sheetT+=dt;saveT+=dt;miniT+=dt;inspT+=dt;
 if(running){if(hudT>.25){hudT=0;hud();const tb=$('#top').getBoundingClientRect().bottom;if(Math.abs(tb-topH)>1){topH=tb;document.documentElement.style.setProperty('--topH',tb+'px');}}if(sheetT>1){sheetT=0;refreshSheet(false);}if(inspT>.5&&sel!=null){inspT=0;const ae=document.activeElement;if(!ae||!$('#insp').contains(ae))renderInsp();}if(saveT>30){saveT=0;saveSlot('auto');}}
 if(miniT>1){miniT=0;drawMini();}
 requestAnimationFrame(frame);}
addEventListener('resize',resize);resize();
try{window.claude?.hot?.snapshot?.(()=>S&&running?{save:serialize()}:{});}catch(e){}
function boot(data){showStart();if(data&&data.save){try{deserialize(data.save);}catch(e){}}requestAnimationFrame(frame);}
if(window.claude?.hot?.ready)window.claude.hot.ready(boot);else boot(window.claude?.hot?.data??{});
</script>
